<div class="site">

    <!-- ヘッダー -->
    <header class="header">
        <a href="index.html" class="site-logo">
            KABUTO BEER

        <input type="checkbox" id="menu-check" class="menu-check">

        <label for="menu-check" class="menu-button">

        <!-- メニュー -->

        <h1 id="question-text">
            ビールを飲むとき、<br>
            どんな味わいが好き？

        <!-- 選択肢 -->
        <div class="question-options">

            <button class="question-option" data-value="sweet">
                甘みのある<br>
                やさしい味
            </button>

            <button class="question-option" data-value="balanced">
                すっきりとした<br>
                バランスのよい味
            </button>

            <button class="question-option" data-value="bitter">
                しっかりとした<br>
                苦味のある味
