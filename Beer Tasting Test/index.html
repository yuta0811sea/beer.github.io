<!DOCTYPE html>

                    ロゴ

                <p class="hero-description">

                <h2 class="hero-catch">

                </div>

            <!-- Column -->
            <section class="column-section">

                <div class="section-heading">
                    <h2>Column</h2>
                    <p>カブトビールの豆知識</p>
                </div>

                <div class="column-card">
                    豆知識を書く場所
                </div>

            </section>

        </main>

        <!-- Footer -->
        <footer class="footer">

            <div class="footer-logo">
                HAnDA
            </div>

            <p>Heritage Augmentation and Digital Activation</p>

            <small>© 2026 HAnDA project</small>
